name: Daily insider scan

on:
  schedule:
    - cron: "30 5 * * 2-6"  # Tue-Sat 05:30 UTC = the morning after each US trading day
    - cron: "0 7 * * 0"     # Sunday 07:00 UTC: weekly journal follow-up (returns vs SPY + summary)
  workflow_dispatch:
    inputs:
      notify:
        description: "Kept for compatibility (every run now sends a heartbeat); the bot's /scan and the watchdog set it"
        type: boolean
        default: false
      mode:
        description: "scan = the daily scan; followup = the weekly journal follow-up"
        type: choice
        options: [scan, followup]
        default: scan

permissions:
  contents: write  # commit data/state.json back

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch tip, not the trigger SHA: a queued run must see the state just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan EDGAR Form 4 filings (or the weekly journal follow-up)
        id: scan
        timeout-minutes: 100  # a step timeout FAILS the step (the alarm runs); a job timeout would only cancel it
        run: python -m bot.scan
        env:
          SCAN_MODE: ${{ (github.event.schedule == '0 7 * * 0' || inputs.mode == 'followup') && 'followup' || 'scan' }}
          SEC_UA: ${{ secrets.SEC_UA }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MIN_INSIDERS: ${{ vars.MIN_INSIDERS }}
          MIN_CLUSTER_USD: ${{ vars.MIN_CLUSTER_USD }}
          MIN_SINGLE_USD: ${{ vars.MIN_SINGLE_USD }}
          WINDOW_DAYS: ${{ vars.WINDOW_DAYS }}
          MAX_CATCHUP: ${{ vars.MAX_CATCHUP }}
          HEARTBEAT_FILE: ${{ runner.temp }}/heartbeat  # written once the scan has reported (heartbeat or alarm)
      - name: Commit state
        id: commit
        if: always()  # keep the days already processed even if the scan failed later
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "Update insider scan state"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase || git rebase --abort || true
          done
          exit 1
      - name: Report a failure the scan could not report itself
        if: failure() || cancelled()  # silence is a failure: a crash, timeout or failed commit still reaches Telegram
        run: |
          python -m bot.scan --alarm "שלב בתהליך ב־GitHub Actions נכשל" && exit 0
          # the bot itself cannot run (e.g. a broken import): a last-resort plain message, disclaimer included
          text="$(printf '❌ הסריקה נכשלה, והבוט לא הצליח לדווח בעצמו: %s\n\n%s' "$RUN_URL" "$DISCLAIMER")"
          curl -fsS --retry 3 -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${text}"
          exit 1
        env:
          DISCLAIMER: "⚠️ מידע לצורכי מחקר בלבד ואינו ייעוץ השקעות. מקור הנתונים: SEC EDGAR."
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          HEARTBEAT_FILE: ${{ runner.temp }}/heartbeat
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
