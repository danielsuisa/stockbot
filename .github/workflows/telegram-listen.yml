name: Telegram listener

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:  # a code deploy runs the listener once right away: smoke-tests TG_TOKEN and (re)starts the schedule
    branches: [main]
    paths: ["bot/**", ".github/workflows/telegram-listen.yml"]

permissions:
  contents: read
  actions: write  # /scan dispatches the daily-scan workflow (the only writer of data/state.json)

concurrency:
  group: telegram-listen
  cancel-in-progress: false  # never kill a run that already ACKed its messages

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Answer Telegram messages
        run: python -m bot.listen
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INSIDER_DAYS: ${{ vars.INSIDER_DAYS }}
          MIN_INSIDERS: ${{ vars.MIN_INSIDERS }}  # same tuning as daily-scan.yml, so /status shows the real rules
          MIN_CLUSTER_USD: ${{ vars.MIN_CLUSTER_USD }}
          MIN_SINGLE_USD: ${{ vars.MIN_SINGLE_USD }}
          WINDOW_DAYS: ${{ vars.WINDOW_DAYS }}
          MAX_CATCHUP: ${{ vars.MAX_CATCHUP }}
          GITHUB_TOKEN: ${{ github.token }}  # for /scan's workflow dispatch; scoped by the permissions above
