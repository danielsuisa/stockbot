name: Overnight momentum backtest

# Replays the pre-registered close-to-open book in bot/overnight_mom.py.
# A NO-GO still exits 0. A hole in the download exits 1. The report is an artifact; it is committed by hand.
# Dispatch only, so a commit of the pre-registration does not start the download by itself.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overnight-mom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay the pre-registered overnight book
        timeout-minutes: 340
        run: python -m bot.overnight_mom
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-mom
          path: |
            docs/backtest/overnight-mom-2*.md
            docs/backtest/overnight-mom-2*.json
          if-no-files-found: warn
          retention-days: 14
