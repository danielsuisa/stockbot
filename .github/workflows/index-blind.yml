name: Index program blind run (spec 8.2, F3)

# Runs only on a push to index-run-blind (the head commit of index-program, Amendment 6 F3). Reads the Stooq file
# from the private repository with the deploy key, checks both sha256 against data/index/manifest.json, and writes
# the blind report of 8.2: counts only, no equity, no price. The report is the only artifact.
on:
  push:
    branches: [index-run-blind]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  blind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the private data repository (deploy key, outside the workspace)
        env:
          DATA_REPO_KEY: ${{ secrets.DATA_REPO_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/data_key"
          printf '%s\n' "$DATA_REPO_KEY" > "$RUNNER_TEMP/data_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/data_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --quiet --depth 1 git@github.com:danielsuisa/stockbot-data.git "$RUNNER_TEMP/private"
          rm -f "$RUNNER_TEMP/data_key"
      - name: The blind run (counts only; both sha256 checked)
        run: python -m bot.index_run --blind --stooq "$RUNNER_TEMP/private/spy_us_d.csv"
      - name: Upload the blind report (the only artifact)
        uses: actions/upload-artifact@v4
        with:
          name: index-blind-report
          path: index-blind-report.json
      - name: Remove the private checkout
        if: always()
        run: rm -rf "$RUNNER_TEMP/private" "$RUNNER_TEMP/data_key"
