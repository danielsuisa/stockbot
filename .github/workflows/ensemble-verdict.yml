name: Ensemble verdict run (spec 6.4, phase D)

# Started ONLY by the owner's explicit act: a manual dispatch on the run branch ensemble-run-blind, never by a push.
# It runs the commit of the blind run on the blind run's inputs: it fails unless the ref is ensemble-run-blind, the
# checked-out commit is the blind run's, the typed confirmation matches, the blind run's input cache (branch-scoped,
# kept 7 days) is restored, the inputs' fingerprint equals the blind run's, and the blind report recomputed from those
# inputs equals the one the blind run uploaded (which also covers the cached quotes). The environment ensemble-verdict
# must be created with the owner as required reviewer before phase D, so even a dispatch waits for a second explicit
# approval; one run at a time. Inputs reach the shell only through env, never interpolated into a script.
on:
  workflow_dispatch:
    inputs:
      blind_run_id:
        description: "The blind run's run id (its input cache key)"
        required: true
      blind_commit:
        description: "The blind run's commit (full sha)"
        required: true
      fingerprint:
        description: "The inputs' fingerprint printed by the blind run"
        required: true
      confirm:
        description: "Type: run the verdict once"
        required: true

permissions:
  contents: read
  actions: read  # to download the blind run's report

concurrency:
  group: ensemble-verdict
  cancel-in-progress: false

env:
  HTTP_CACHE: .cache/http
  PYTHONHASHSEED: "0"  # the verdict reproduces the blind report: same hash seed, same image (ubuntu-24.04)

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    environment: ensemble-verdict
    steps:
      - name: Check the ref, the commit and the confirmation
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BLIND_COMMIT: ${{ inputs.blind_commit }}
          CONFIRM: ${{ inputs.confirm }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          test "$REF" = "refs/heads/ensemble-run-blind" || { echo "verdict refused: not the run branch"; exit 1; }
          test "$SHA" = "$BLIND_COMMIT" || { echo "verdict refused: not the blind run's commit"; exit 1; }
          test "$CONFIRM" = "run the verdict once" || { echo "verdict refused: confirmation"; exit 1; }
          test -n "$FINGERPRINT" || { echo "verdict refused: no fingerprint"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the blind run's input cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ensemble-inputs-${{ inputs.blind_run_id }}-4
          fail-on-cache-miss: true
      - name: Download the blind run's report (the verdict must reproduce it)
        uses: actions/download-artifact@v4
        with:
          name: ensemble-blind-report
          path: blind
          run-id: ${{ inputs.blind_run_id }}
          github-token: ${{ github.token }}
      - name: The verdict run (network closed; writes its report files only)
        env:
          BLIND_COMMIT: ${{ inputs.blind_commit }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: python -m bot.ensemble --verdict --blind-commit "$BLIND_COMMIT" --owner-go-ahead --fingerprint "$FINGERPRINT" --blind-report blind/ensemble-blind-report.json
      - name: Upload the verdict files
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-verdict
          path: |
            ensemble-verdict-report.json
            ensemble-tickets.csv
            docs/backtest/ensemble-2*.md
