name: Index program data probe (temporary)

# Runs only on a push to index-data-probe (spec 2026-10-12-index-program-design.md, phase 1, Amendments 1 to 3).
# The Stooq file is read from the private repository with the deploy key; Alpaca bars stay in memory; the artifact
# holds only counts, dates, shares of days, differences, the H.15 file (public domain) and the manifest. No price
# and no secret is printed. No return of any rule is computed.
on:
  push:
    branches: [index-data-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the private data repository (deploy key, outside the workspace)
        env:
          DATA_REPO_KEY: ${{ secrets.DATA_REPO_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/data_key"
          printf '%s\n' "$DATA_REPO_KEY" > "$RUNNER_TEMP/data_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/data_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --quiet --depth 1 git@github.com:danielsuisa/stockbot-data.git "$RUNNER_TEMP/private"
          rm -f "$RUNNER_TEMP/data_key"
      - name: Probe (in memory; counts and agreement only)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.index_probe --stooq "$RUNNER_TEMP/private/spy_us_d.csv" --out probe-out
      - name: Upload the probe report (no price)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-data-probe-3
          path: probe-out/
      - name: Remove the private checkout
        if: always()
        run: rm -rf "$RUNNER_TEMP/private" "$RUNNER_TEMP/data_key"
