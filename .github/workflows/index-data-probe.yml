name: Index program data probe (temporary)

# Runs only on a push to index-data-probe (spec 2026-10-12-index-program-design.md, phase 1). Fetches the sources,
# checks integrity and price agreement only, and uploads the probe report plus the Stooq and FRED files. Yahoo and
# Alpaca data are compared in memory and never written. No return of any rule is computed.
on:
  push:
    branches: [index-data-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe the sources (counts and agreement only)
        run: python -m bot.index_probe index-probe-out
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Upload the probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-data-probe
          path: index-probe-out/
