name: K10s shadow journal

on:
  # No schedule and no Telegram. The listener used to dispatch this at 07:00 UTC Tuesday-Saturday and the run posted
  # the "מעקב צל" digest. That post was removed on 2026-10-27. A manual run still writes data/shadow_journal.json.
  workflow_dispatch:
    inputs:
      mode:
        description: "manual = run now and say so when there is no new session; slot = behave like the clock's run"
        type: choice
        options: [manual, slot]
        default: manual

permissions:
  contents: write  # commit data/shadow_journal.json

concurrency:
  group: shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch tip: the journal committed by the last run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Journal the completed sessions (no orders, no Telegram)
        timeout-minutes: 20
        run: python -m bot.shadow
        env:
          SHADOW_MODE: ${{ inputs.mode || 'slot' }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit the journal
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/shadow_journal.json ]; then git add data/shadow_journal.json; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update shadow journal"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase || git rebase --abort || true
          done
          exit 1
