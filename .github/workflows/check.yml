name: Check ticker

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker, e.g. AAPL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and send the report
        run: python -m bot.check
        env:
          TICKER: ${{ inputs.ticker }}  # via env only: never expand user input inside run
          SEC_UA: ${{ secrets.SEC_UA }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INSIDER_DAYS: ${{ vars.INSIDER_DAYS }}
